<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 가족 책장</title>
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#2b2622;--mute:#8a8178;--line:#ebe3d6;--star:#f5a623;--btn:#2b2622;--btnink:#fff;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#1c1917;--card:#292524;--ink:#f3ede4;--mute:#a39a8f;--line:#3a3430;--btn:#f3ede4;--btnink:#1c1917}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.45;padding:env(safe-area-inset-top,0px) 0 96px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mute);font-size:13px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.lbl{font-size:12px;color:var(--mute);margin:14px 0 6px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 12px;padding-bottom:2px}
.tabs .chip{white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:700;font-size:16px}
.cnt{font-size:13px;color:var(--mute)}
.cnt b{font-size:18px;color:var(--ink)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.pct{font-size:13px;color:var(--mute);display:flex;justify-content:space-between}
.book{padding:12px 0;border-top:1px solid var(--line)}
.book:first-child{border-top:0}
.bt{font-weight:600;font-size:15px}
.meta{font-size:12px;color:var(--mute);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.rev{font-size:14px;margin-top:6px}
.st{position:relative;display:inline-block;color:var(--line);letter-spacing:1px;font-size:14px;white-space:nowrap}
.st i{position:absolute;left:0;top:0;overflow:hidden;color:var(--star);font-style:normal;white-space:nowrap}
.rt{font-weight:700;color:var(--ink);font-size:13px}
.who{font-size:11px;padding:2px 8px;border-radius:99px;color:#fff}
.del,.edb{border:0;background:none;color:var(--mute);font-size:12px;cursor:pointer;font-family:inherit;padding:2px 6px}
.edb{margin-left:auto}
.empty{text-align:center;color:var(--mute);padding:28px 0;font-size:14px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--btnink);border:0;border-radius:999px;padding:14px 22px;font-size:15px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;font-family:inherit}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sheet h2{margin:0 0 4px;font-size:18px}
input[type=text],input[type=date],input[type=number]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:16px;font-family:inherit}
.big{display:flex;align-items:center;justify-content:space-between;gap:10px}
.go{width:100%;margin-top:16px;background:var(--btn);color:var(--btnink);border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.go:disabled{opacity:.5}
[hidden]{display:none!important}
.login-desc{color:var(--mute);font-size:14px;margin:9px 0 0}
.login-note{font-size:12px;color:var(--mute);margin-top:10px}
.auth-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 12px;font-size:12px;color:var(--mute)}
.auth-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;display:none;z-index:30;max-width:90%}
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 우리 가족 책장</h1>
  <div class="sub">2026년 독서 챌린지</div>
  <div class="card" id="loginPanel">
    <div class="name">가족 책장에 로그인</div>
    <p class="login-desc">가족의 구글 계정으로 로그인하면 같은 독서 기록을 실시간으로 볼 수 있습니다.</p>
    <button class="go" id="loginBtn" type="button">Google 계정으로 로그인</button>
    <div class="login-note" id="loginNote">등록된 가족 계정만 이용할 수 있습니다.</div>
  </div>
  <div class="auth-row" id="authRow" hidden>
    <span id="authName"></span>
    <button class="chip" id="logoutBtn" type="button">로그아웃</button>
  </div>
  <div class="tabs" id="tabs" hidden></div>
  <div id="main"><div class="empty">로그인을 준비하는 중…</div></div>
</div>
<button class="fab" id="fab" style="display:none">＋ 책 기록</button>

<div class="ov" id="ov">
  <div class="sheet">
    <h2 id="fh">책 기록하기</h2>
    <div class="lbl">책 이름</div>
    <input type="text" id="ftitle" maxlength="80" placeholder="책 제목">
    <div class="lbl">별점 (0~5, 0.1점 단위)</div>
    <div class="big"><span class="st" id="fst" style="font-size:24px"></span><input type="number" id="frate" inputmode="decimal" min="0" max="5" step="0.1" placeholder="0~5" style="width:100px;text-align:center;font-weight:800"></div>
    <div class="lbl">읽은 날</div>
    <input type="date" id="fdate">
    <div class="lbl">한줄평</div>
    <input type="text" id="frev" maxlength="100" placeholder="한 줄로 남겨요">
    <button class="go" id="save">저장</button>
    <button class="go" id="cancel" style="background:transparent;color:var(--mute);margin-top:4px">닫기</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,addDoc,updateDoc,deleteDoc,doc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* Firebase 웹 앱 설정값 (Firebase 콘솔 > 프로젝트 설정) */
const firebaseConfig = {
  apiKey: "AIzaSyDc7mmUW52hUQ8_NyTqR234s1FJeoVywec",
  authDomain: "family-bookshelf-574bf.firebaseapp.com",
  projectId: "family-bookshelf-574bf",
  storageBucket: "family-bookshelf-574bf.firebasestorage.app",
  messagingSenderId: "563077789806",
  appId: "1:563077789806:web:3665f76a17b88c01600e7f"
};

const YEAR=2026;
const M=[{n:"만식",g:30,c:"#3b82f6"},{n:"금련",g:52,c:"#e0527a"},{n:"다인",g:30,c:"#16a34a"},{n:"다예",g:30,c:"#9333ea"}];
let books=[],tab="all",fwho="",editId="",db=null,col=null,auth=null,unsubBooks=null,currentUser=null;
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mem=n=>M.find(m=>m.n===n);
const stars=r=>{r=Math.max(0,Math.min(5,+r||0));return '<span class="st"><i style="width:'+(r/5*100)+'%">★★★★★</i>★★★★★</span>'};
const toast=t=>{const e=$("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2600)};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};

const yearBooks=n=>books.filter(b=>b.who===n&&String(b.date||"").slice(0,4)===String(YEAR));
function bookHTML(b,showWho){
  const m=mem(b.who)||{c:"#888"};
  return '<div class="book"><div class="bt">'+esc(b.title)+'</div><div class="meta">'+
    (showWho?'<span class="who" style="background:'+m.c+'">'+esc(b.who)+'</span>':'')+
    stars(b.rating)+'<span class="rt">'+(+b.rating).toFixed(1)+'</span><span>'+esc(b.date)+'</span>'+
    '<button class="edb" data-ed="'+esc(b.id)+'">수정</button><button class="del" data-id="'+esc(b.id)+'">삭제</button></div>'+
    (b.review?'<div class="rev">“'+esc(b.review)+'”</div>':'')+'</div>';
}
function progHTML(m,link){
  const c=yearBooks(m.n).length,p=Math.round(c/m.g*1000)/10,w=Math.min(100,p);
  return '<div class="card"'+(link?' data-go="'+m.n+'" style="cursor:pointer"':'')+'><div class="top"><span class="name">'+m.n+(c>=m.g?' 🎉':'')+'</span><span class="cnt"><b>'+c+'</b> / '+m.g+'권</span></div>'+
    '<div class="bar"><i style="width:'+w+'%;background:'+m.c+'"></i></div>'+
    '<div class="pct"><span>'+p+'% 달성</span><span>'+(c>=m.g?'목표 달성!':'남은 '+(m.g-c)+'권')+'</span></div></div>';
}
function render(){
  if(!currentUser)return;
  $("fab").style.display=tab==="all"?"none":"block";
  $("tabs").innerHTML=['all',...M.map(m=>m.n)].map(t=>'<button class="chip'+(tab===t?' on':'')+'" data-tab="'+t+'">'+(t==='all'?'전체':t+'의 책장')+'</button>').join("");
  let h="";
  if(tab==="all"){
    h=M.map(m=>progHTML(m,true)).join("");
    const rec=books.slice(0,12);
    h+='<div class="lbl">최근 기록</div>'+(rec.length?'<div class="card">'+rec.map(b=>bookHTML(b,true)).join("")+'</div>':'<div class="empty">아직 기록이 없어요. 내 책장을 눌러 첫 책을 남겨봐요!</div>');
  }else{
    const m=mem(tab),list=books.filter(b=>b.who===tab);
    h=progHTML(m,false)+(list.length?'<div class="card">'+list.map(b=>bookHTML(b,false)).join("")+'</div>':'<div class="empty">아직 읽은 책이 없어요</div>');
  }
  $("main").innerHTML=h;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-go],[data-ed],.del");if(!t||!currentUser)return;
  if(t.dataset.ed){openEdit(t.dataset.ed)}
  else if(t.dataset.tab){tab=t.dataset.tab;render()}
  else if(t.dataset.go){tab=t.dataset.go;render();window.scrollTo(0,0)}
  else if(t.classList.contains("del")){
    if(!t.dataset.ask){t.dataset.ask="1";t.textContent="정말 삭제?";t.style.color="#e11d48";setTimeout(()=>{t.dataset.ask="";t.textContent="삭제";t.style.color=""},3000);return}
    t.textContent="삭제 중…";
    deleteDoc(doc(db,"books",t.dataset.id)).then(()=>toast("삭제했어요")).catch(err=>{t.textContent="삭제";toast("삭제 실패: "+(err.code||err.message))});
  }
});
const drawWho=()=>{$("fh").textContent=fwho+(editId?"의 책 수정하기":"의 책 기록하기")};
const drawRate=()=>{const v=Math.max(0,Math.min(5,parseFloat($("frate").value)||0));$("fst").innerHTML=stars(v).replace('class="st"','')};
$("frate").addEventListener("input",drawRate);
$("fab").onclick=()=>{
  editId="";fwho=tab;drawWho();$("ftitle").value="";$("frev").value="";$("frate").value="";$("fdate").value=today();drawRate();
  $("ov").classList.add("show");
};
function openEdit(id){
  const b=books.find(x=>x.id===id);if(!b)return;
  editId=id;fwho=b.who;drawWho();$("ftitle").value=b.title||"";$("frate").value=b.rating;$("fdate").value=b.date||today();$("frev").value=b.review||"";drawRate();
  $("ov").classList.add("show");
}
$("cancel").onclick=()=>$("ov").classList.remove("show");
$("save").onclick=()=>{
  const title=$("ftitle").value.trim();
  if(!currentUser){toast("로그인 후 기록할 수 있습니다");return}
  if(!title){toast("책 이름을 적어주세요");return}
  const r=parseFloat($("frate").value);
  if(isNaN(r)||r<0||r>5||Math.abs(r*10-Math.round(r*10))>0.00001){toast("별점은 0~5 사이의 0.1점 단위로 입력해주세요");return}
  const d={who:fwho,title,rating:Math.round(r*10)/10,date:$("fdate").value||today(),review:$("frev").value.trim()};
  const b=$("save");b.disabled=true;
  const op=editId?updateDoc(doc(db,"books",editId),d):addDoc(col,{...d,ts:Date.now()});
  op.then(()=>{$("ov").classList.remove("show");tab=fwho;render();toast(editId?"수정했어요":"기록했어요 ✨")})
    .catch(err=>toast("저장 실패: "+(err.code||err.message)))
    .finally(()=>{b.disabled=false});
};

const app=initializeApp(firebaseConfig);
db=getFirestore(app);
col=collection(db,"books");
auth=getAuth(app);

$("loginBtn").onclick=async()=>{
  const btn=$("loginBtn");btn.disabled=true;
  $("loginNote").textContent="구글 로그인 창을 여는 중…";
  try{
    await signInWithPopup(auth,new GoogleAuthProvider());
  }catch(err){
    if(err.code==="auth/popup-closed-by-user"||err.code==="auth/cancelled-popup-request"){
      $("loginNote").textContent="로그인이 취소되었습니다.";
    }else if(err.code==="auth/unauthorized-domain"){
      $("loginNote").textContent="Firebase Authentication의 승인된 도메인에 현재 사이트 주소를 등록해주세요.";
    }else if(err.code==="auth/popup-blocked"){
      $("loginNote").textContent="팝업이 차단되었습니다. Safari 또는 Chrome에서 팝업 허용 후 다시 시도해주세요.";
    }else{
      $("loginNote").textContent="로그인 실패: "+(err.code||err.message);
    }
  }finally{btn.disabled=false}
};
$("logoutBtn").onclick=()=>signOut(auth).catch(err=>toast("로그아웃 실패: "+(err.code||err.message)));

onAuthStateChanged(auth,user=>{
  if(unsubBooks){unsubBooks();unsubBooks=null}
  currentUser=user;
  books=[];
  $("ov").classList.remove("show");
  if(!user){
    tab="all";
    $("loginPanel").hidden=false;
    $("authRow").hidden=true;
    $("tabs").hidden=true;
    $("fab").style.display="none";
    $("main").innerHTML='<div class="empty">로그인하면 가족의 독서 기록을 볼 수 있어요.</div>';
    return;
  }
  $("loginPanel").hidden=true;
  $("authRow").hidden=false;
  $("tabs").hidden=false;
  $("authName").textContent=(user.displayName||"가족")+" · "+(user.email||"");
  $("main").innerHTML='<div class="empty">가족 책장을 불러오는 중…</div>';
  unsubBooks=onSnapshot(col,s=>{
    books=s.docs.map(x=>({...x.data(),id:x.id})).sort((a,b)=>String(b.date).localeCompare(String(a.date))||(b.ts||0)-(a.ts||0));
    render();
  },err=>{
    $("fab").style.display="none";
    $("main").innerHTML='<div class="empty">책장에 접근하지 못했습니다.<div style="margin-top:8px">'+
      (err.code==="permission-denied"?"Firestore 보안 규칙에 이 구글 계정 이메일이 등록되어 있는지 확인해주세요.":esc(err.code||err.message))+'</div></div>';
  });
},err=>{
  $("loginPanel").hidden=false;
  $("loginNote").textContent="인증 확인 실패: "+(err.code||err.message);
});

</script>
</body>
</html>
